<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Knowledge Test</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>

<body>
  <main>
    <div class="top_bar" id="top_bar">
      <h1 class="mainTxt" id="title">Campus Knowledge Test</h1>

    </div>
    <div class="lobby" id="menu">
      <button type="button" class="button" id="start">
        <h1 class="mainTxt" id="startext">Start</h1>
      </button>

      <button type="button" class="button" id="instructions">
        <h2 class="mainTxt" id="helptext">Help</h2>
      </button>



    </div>

    <div id="game">
      <div id="imageSide">
        <h2>Where was this image taken?</h2>
        <div id="image">

        </div>

      </div>

      <div id="mapSide">
        <h2>choose</h2>
        <input type="image"
          src="https://cdn.discordapp.com/attachments/400271288696045576/1474719614163222538/New_Project.png?ex=699adf2a&is=69998daa&hm=33b1460417d702383c3804fcc03c634da81c2472ab4c15988ad208f1a28b825a&"
          id="mapbtn" />

        <button type="button" class="button" id="send">
          <p>Send</p>
        </button>
      </div>
    </div>
  </main>
  <script src="test.js"></script>
</body>

</html>
